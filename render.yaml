services:
  - type: web
    name: qualitytrack-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_ROLE_KEY, sync: false}
      - {key: ALLOWED_ORIGINS, sync: false}
      - {key: YOLO_MODEL_PATH, value: ml/weights/best.pt}
      - {key: MODEL_VERSION, value: v1.0.0}
